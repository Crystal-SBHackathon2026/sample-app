apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
spec:
  template:
    spec:
      containers:
        - name: sample-app
          env:
            - name: DEPLOY_ENV
              value: onprem
            - name: DEPLOY_REGION
              value: busan-local
            - name: DB_SSL
              value: 'false'
