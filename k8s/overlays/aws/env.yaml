apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
spec:
  template:
    spec:
      containers:
        - name: sample-app
          env:
            - name: DEPLOY_ENV
              value: aws
            - name: DEPLOY_REGION
              value: ap-northeast-2
            - name: DB_SSL
              value: 'true'
            - name: PGSSLROOTCERT
              value: /db-ca/ca.pem
          volumeMounts:
            - name: db-ca
              mountPath: /db-ca
              readOnly: true
      volumes:
        - name: db-ca
          secret:
            secretName: sample-app-db-ca
