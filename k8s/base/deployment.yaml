apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-app
  template:
    metadata:
      labels:
        app: sample-app
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/path: /metrics
        prometheus.io/port: '8080'
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sample-app
          image: docker.io/kty1021/sample-app
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sample-app-db
                  key: database-url
            - name: FAIL_RATE
              value: '0'
            - name: APP_CONTROL_FILE
              value: /app-control/control.json
            # Secret 이 없으면 pod 는 뜨고 /api/requests 만 503 으로 닫힌다.
            - name: REQUEST_API_AUTH
              value: required
            - name: REQUEST_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sample-app-api-token
                  key: token
                  optional: true
          volumeMounts:
            - name: control
              mountPath: /app-control
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 3
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: control
          configMap:
            name: sample-app-control
