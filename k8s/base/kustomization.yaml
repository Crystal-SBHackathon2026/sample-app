apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hackathon
resources:
  - deployment.yaml
  - service.yaml
configMapGenerator:
  - name: sample-app-control
    literals:
      - 'control.json={"writes_paused":false}'
generatorOptions:
  disableNameSuffixHash: true
images:
  - name: docker.io/kty1021/sample-app
    newTag: replace-with-commit-sha
