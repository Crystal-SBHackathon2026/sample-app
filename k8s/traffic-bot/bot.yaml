apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: traffic-bot-ledger
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-bot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: traffic-bot
  template:
    metadata:
      labels:
        app: traffic-bot
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '9091'
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: traffic-bot
          image: ghcr.io/softbankhackathon2026/sample-app
          command: [node, packages/traffic-bot/bin/traffic-bot.js]
          env:
            - name: BOT_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: traffic-bot-target
                  key: base-url
            - name: BOT_LEDGER_DIR
              value: /data/ledger
            - name: BOT_RUN_ID
              value: forward_001
            - name: BOT_PHASE
              value: onprem_live
            - name: BOT_MAX_RECORDS
              value: '10000'
            - name: BOT_MAX_LEDGER_BYTES
              value: '8388608'
            - name: BOT_RATE
              value: '1'
            - name: BOT_METRICS_PORT
              value: '9091'
          ports:
            - name: metrics
              containerPort: 9091
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 3
            initialDelaySeconds: 20
          volumeMounts:
            - name: ledger
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: ledger
          persistentVolumeClaim:
            claimName: traffic-bot-ledger
