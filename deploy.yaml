# AI 검토 rv_20261009_59cd5a99 가 고친 명세입니다. 무엇을 왜 고쳤는지는 검토 결과(rounds)에 있습니다.
api_version: crystal.review/v1alpha1
kind: DeploySpec
metadata:
  name: sample-app
  repository: Crystal-SBHackathon2026/sample-app
target:
  env: aws
  region: ap-northeast-2
  namespace: sample-app
image:
  repository: ghcr.io/crystal-sbhackathon2026/sample-app
  platforms:
  - amd64
runtime:
  port: 8080
  replicas: 3
  health:
    liveness: /healthz
    readiness: /healthz
  resources:
    cpu_request: 50m
    memory_request: 64Mi
    cpu_limit: 250m
    memory_limit: 128Mi
  env:
    DEPLOY_ENV: aws
    DEPLOY_REGION: ap-northeast-2
    # 일부러 넣은 장애. /api/info 요청의 30%를 500으로 실패시킨다.
    # 카나리가 부분 에러율로 실제 중단되는지 확인하려고 넣었고, 확인 뒤 되돌린다.
    FAIL_RATE: "0.3"
network:
  ingress:
    public: true
    tls: false
