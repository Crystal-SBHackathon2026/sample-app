# 검토 서비스(review-service) 배포 명세 — 이 PR 의 deploy.yaml 을 AI 가 검토하고, 통과하면 gitops overlay 로 배포한다.
api_version: crystal.review/v1alpha1
kind: DeploySpec
metadata:
  name: sample-app
  repository: Crystal-SBHackathon2026/sample-app
target:
  env: aws
  region: ap-northeast-2
  namespace: sample-app
image:
  repository: ghcr.io/crystal-sbhackathon2026/sample-app
  platforms: [amd64]
runtime:
  port: 8080
   replicas: 2
  health:
    readiness: /healthz
    liveness: /healthz
  resources:
    cpu_request: 50m
    memory_request: 64Mi
    cpu_limit: 250m
    memory_limit: 128Mi
  env:
    DEPLOY_ENV: aws
    DEPLOY_REGION: ap-northeast-2
network:
  ingress:
    public: true
    tls: false
