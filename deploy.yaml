# Compatibility input for the existing DeploySpec renderer.
# The directly usable Kubernetes manifests are under k8s/.
api_version: crystal.review/v1alpha1
kind: DeploySpec
metadata:
  name: sample-app
  repository: SoftBankHackathon2026/sample-app
target:
  env: aws
  region: ap-northeast-2
  namespace: hackathon
image:
  repository: ghcr.io/softbankhackathon2026/sample-app
  platforms:
    - amd64
runtime:
  port: 8080
  replicas: 2
  health:
    liveness: /healthz
    readiness: /readyz
  resources:
    cpu_request: 50m
    memory_request: 128Mi
    cpu_limit: 500m
    memory_limit: 256Mi
  env:
    DEPLOY_ENV: aws
    DEPLOY_REGION: ap-northeast-2
    FAIL_RATE: '0'
    DB_SSL: 'true'
network:
  ingress:
    public: false
    tls: true
secrets:
  - name: DATABASE_URL
    source: k8s-secret
    key: database-url
  - name: DB_SSL_CA
    source: k8s-secret
    key: rds-ca-pem
