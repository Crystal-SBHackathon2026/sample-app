# review-service 가 형식 오류를 고친 명세 — 원문 주석은 지워졌다. 값을 고쳐 커밋하면 다시 검토한다
api_version: crystal.review/v1alpha1
kind: DeploySpec
metadata:
  name: sample-app
  repository: Crystal-SBHackathon2026/sample-app
target:
  env: aws
  region: ap-northeast-2
  namespace: sample-app
image:
  repository: ghcr.io/crystal-sbhackathon2026/sample-app
  platforms:
  - amd64
runtime:
  port: 8080
  replicas: 2
  health:
    liveness: /healthz
  resources:
    cpu_request: 50m
    memory_request: 64Mi
    cpu_limit: 250m
    memory_limit: 128Mi
  env:
    DEPLOY_ENV: aws
    DEPLOY_REGION: ap-northeast-2
network:
  ingress:
    public: true
    tls: false
