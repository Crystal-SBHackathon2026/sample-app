api_version: crystal.review/v1alpha1
kind: DeploySpec
metadata:
  name: sample-app
  repository: Crystal-SBHackathon2026/sample-app
target:
  env: local
  region: busan-local
  namespace: sample-app
image:
  repository: ghcr.io/crystal-sbhackathon2026/sample-app
  platforms:
  - amd64
runtime:
  port: 8080
  replicas: 3
  health:
    liveness: /healthz
    readiness: /healthz
  resources:
    cpu_request: 50m
    memory_request: 64Mi
    cpu_limit: 250m
    memory_limit: 128Mi
  env:
    DEPLOY_ENV: local
    DEPLOY_REGION: busan-local
network:
  ingress:
    public: true
    tls: false
