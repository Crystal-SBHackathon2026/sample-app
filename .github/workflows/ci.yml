# CI: 테스트(실제 PostgreSQL) → amd64·arm64 이미지 빌드 → 둘 다 취약점 검사
# → (main만) Docker Hub 공개 저장소 게시 → GitOps 이미지 태그 갱신. 예선 issue
# #29 의 병렬화·main 스캔 생략을 되돌린 이유와 비용은
# docs/decisions/2026-11-04-ci-gate-after-db-tests.md(ADR-0003).
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ghost_test
          POSTGRES_PASSWORD: ghost_test
          POSTGRES_DB: ghost_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ghost_test -d ghost_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgres://ghost_test:ghost_test@localhost:5432/ghost_test
      - name: Render Kubernetes overlays
        run: |
          kubectl kustomize k8s/overlays/aws > /tmp/ghost-aws.yaml
          kubectl kustomize k8s/overlays/onprem > /tmp/ghost-onprem.yaml
          kubectl kustomize k8s/traffic-bot > /tmp/ghost-bot.yaml
  build:
    # 실제 PG 시험을 통과한 커밋만 이미지로 나간다. 새 조직의 브랜치 보호를
    # 확인하지 못했으므로 #29 ② 의 병렬화를 되돌렸다(ADR-0003).
    needs: test
    runs-on: ubuntu-latest
    env:
      HAS_GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN != '' }}
      # 공개 저장소. 태그는 커밋 SHA 와 그 arch 별 태그뿐이다(latest 없음).
      IMAGE: docker.io/kty1021/sample-app
      SHA: ${{ github.sha }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build immutable images
        run: |
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/$arch" --load \
              --build-arg GIT_SHA="$SHA" -t "$IMAGE:$SHA-$arch" .
          done
      # PR 과 main 모두 두 arch 를 스캔한다. 게시 대상 이미지를 직접 검사해야
      # PR 스캔 뒤 공개된 CVE 도 잡는다. 하나라도 실패하면 우회 게시하지 않고
      # 고친 뒤 다시 돈다(ADR-0003).
      - name: Scan images
        run: |
          for arch in amd64 arm64; do
            docker save "$IMAGE:$SHA-$arch" \
              -o "$RUNNER_TEMP/sample-app-$arch.tar"
            docker run --rm \
              -v "$RUNNER_TEMP/sample-app-$arch.tar:/image.tar:ro" \
              aquasec/trivy:0.70.0 image --input /image.tar \
              --scanners vuln,secret --severity CRITICAL --ignore-unfixed \
              --exit-code 1
          done
      # 토큰이 없으면 로그인이 실패해 게시 단계로 가지 않는다.
      - uses: docker/login-action@v4
        if: github.ref == 'refs/heads/main'
        with:
          username: kty1021
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish images
        if: github.ref == 'refs/heads/main'
        run: |
          for arch in amd64 arm64; do
            docker push "$IMAGE:$SHA-$arch"
          done
          docker buildx imagetools create -t "$IMAGE:$SHA" \
            "$IMAGE:$SHA-amd64" "$IMAGE:$SHA-arm64"
      - name: Checkout finals GitOps configuration
        if: github.ref == 'refs/heads/main' && env.HAS_GITOPS_TOKEN == 'true'
        uses: actions/checkout@v7
        with:
          repository: SoftBankHackathon2026/gitops
          ref: main
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
      - name: Update published image tag
        if: github.ref == 'refs/heads/main' && env.HAS_GITOPS_TOKEN == 'true'
        working-directory: gitops
        env:
          SAMPLE_APP_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PYTHON'
          import os
          import re
          from pathlib import Path
          path = Path('apps/sample-app/base/kustomization.yaml')
          text = path.read_text()
          # Docker Hub 로 바뀐 base 가 main 에 없으면 태그만 바꾸지 않고 멈춘다.
          if os.environ['IMAGE'] not in text:
              raise SystemExit('Merge Docker Hub GitOps configuration first')
          updated, count = re.subn(r'(?m)^(\s*newTag:) .+$',
                                  lambda m: m[1] + ' ' + os.environ['SAMPLE_APP_SHA'],
                                  text)
          if count != 1:
              raise SystemExit('Expected one sample-app image tag')
          path.write_text(updated)
          PYTHON
          if git diff --quiet; then exit 0; fi
          git config user.name "ghost-ci"
          git config user.email "ghost-ci@users.noreply.github.com"
          git add apps/sample-app/base/kustomization.yaml
          git commit -m "chore: update sample-app image ($SAMPLE_APP_SHA)"
          git push origin HEAD:main
      - name: GitOps token not configured
        if: github.ref == 'refs/heads/main' && env.HAS_GITOPS_TOKEN != 'true'
        run: echo "Image published. Configure GITOPS_TOKEN for automatic GitOps updates."
