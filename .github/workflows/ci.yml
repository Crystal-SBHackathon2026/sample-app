# CI: 테스트 → 이미지 빌드 → 취약점 검사 → (main만) GHCR 푸시 → GitOps 레포 이미지 태그 갱신
# CD는 Argo CD가 GitOps 레포 변경을 감지해 각 클러스터(로컬 k3s, EKS, GKE)에 배포한다.
#
# 🔴 이 파일은 배포 전 구간 시간에 직접 들어간다 (sample-app#29).
#    PR 에서 test·build 가 돌고 wait_ci 가 그것을 기다린 뒤 병합되고,
#    병합 후 main 에서 같은 빌드가 또 돈다. 느려지는 변경은 데모 시간을 늘린다.
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  IMAGE: ghcr.io/crystal-sbhackathon2026/sample-app

jobs:
  # test 와 build 는 서로 기다리지 않는다 (#29 ②).
  # 전에는 build 에 needs: test 가 있어서 10초를 직렬로 더 썼다. PR·main 양쪽에서 그랬다.
  #
  # ⚠️ 맞바꾼 것: main 에서 test 가 깨져도 푸시·태그 갱신이 진행된다.
  #    PR 쪽은 브랜치 보호가 test·build·review-service/verify 를 모두 요구하므로
  #    main 에 올라온 트리는 이미 테스트를 통과한 것이다(squash 라 내용이 같다).
  #    테스트가 깨지면 main CI 가 빨간색으로 남아 바로 보인다.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # 🔴 job 레벨에 둔다. step 레벨 env 는 그 step 자신의 if: 에서 보이지 않는다.
    env:
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: 이미지 빌드
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t "$IMAGE:${{ github.sha }}" .

      - name: 취약점 검사 (CRITICAL 발견 시 실패)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: GHCR 로그인
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 푸시
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      # GitOps 태그 갱신을 이 job 안에서 한다 (#29 ③).
      # 전에는 별도 job(update-gitops)이라 러너를 새로 띄우는 데만 10초 넘게 걸렸고,
      # gitops 레포를 전체 히스토리로 clone 했다. sed 한 줄 바꾸는 일에 그랬다.
      #
      # 🔴 반드시 이미지 푸시 뒤에 와야 한다. 순서가 뒤집히면 Argo CD 가
      #    GHCR 에 아직 없는 태그를 배포하려다 ImagePullBackOff 가 된다.
      - name: GitOps 레포 이미지 태그 갱신
        if: github.ref == 'refs/heads/main' && env.GITOPS_TOKEN != ''
        run: |
          git clone --depth 1 "https://x-access-token:${GITOPS_TOKEN}@github.com/Crystal-SBHackathon2026/gitops.git"
          cd gitops
          sed -i "s/newTag: .*/newTag: ${{ github.sha }}/" apps/sample-app/base/kustomization.yaml
          git config user.name "crystal-ci"
          git config user.email "crystal-ci@users.noreply.github.com"
          git commit -am "chore: sample-app 이미지 태그 갱신 (${GITHUB_SHA::7})" || echo "변경 없음"
          git push

      - name: GitOps 토큰 없음 안내
        if: github.ref == 'refs/heads/main' && env.GITOPS_TOKEN == ''
        run: echo "GITOPS_TOKEN 시크릿이 없어 GitOps 갱신을 건너뜁니다."
